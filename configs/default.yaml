experiment_name: "prompt_optimization_v1"
description: "Prompt optimization and model evaluation benchmark"
seed: 42
num_runs: 5

models:
  - name: "gpt-4o"
    model_id: "gpt-4o"
    temperature: 0.7
    max_tokens: 1024
    top_p: 0.95
  - name: "gpt-4o-mini"
    model_id: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 1024
    top_p: 0.95

metric_weights:
  bleu: 0.25
  rouge_l: 0.25
  f1: 0.25
  faithfulness: 0.25

prompt_templates:
  - "Answer the following question:\n{input}"
  - "Instruction: Provide a detailed and accurate response to the question below.\n\nQuestion: {input}\nAnswer:"
  - "You are an expert assistant. Think step by step and answer precisely.\n\n{input}"

data_path: "data/processed"
results_path: "experiments/results"
log_path: "experiments/logs"

significance_level: 0.05
confidence_level: 0.95
